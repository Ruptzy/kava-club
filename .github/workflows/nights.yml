name: Night recaps

on:
  push:
    branches: [main]
    paths:
      - "nights.json"
      - "img/nights/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'nights-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the recap pages
        run: python build/build_nights.py
      - name: Commit if changed
        run: |
          git config user.name "nights-bot"
          git config user.email "nights-bot@users.noreply.github.com"
          git add nights es/noches nights.xml sitemap.xml
          git diff --cached --quiet || git commit -m "Build the night recaps"
          git push
