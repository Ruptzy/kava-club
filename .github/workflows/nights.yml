name: Night recaps

on:
  push:
    branches: [main]
    paths:
      - "nights.json"
      - "img/nights/**"
  workflow_dispatch:

permissions:
  contents: write

# two posts in quick succession must not race each other into a double Discord post
concurrency:
  group: night-recaps
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'nights-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Build the recap pages
        run: python build/build_nights.py
      - name: Commit the pages
        run: |
          git config user.name "nights-bot"
          git config user.email "nights-bot@users.noreply.github.com"
          git add nights es/noches nights.xml sitemap.xml img/nights
          git diff --cached --quiet || git commit -m "Build the night recaps"
          git pull --rebase --quiet origin main
          git push
      # after the pages are safe: a Discord outage must never hold up the site
      - name: Post to the club Discord
        continue-on-error: true
        env:
          DISCORD_RECAPS_WEBHOOK: ${{ secrets.DISCORD_RECAPS_WEBHOOK }}
        run: python build/post_discord.py
      - name: Record what Discord has
        if: always()
        run: |
          if [ -f discord-posted.json ]; then
            git add discord-posted.json
            git diff --cached --quiet || git commit -m "Record the Discord recap posts"
            git pull --rebase --quiet origin main
            git push
          fi
