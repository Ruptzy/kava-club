name: Weekly email

on:
  schedule:
    # A backstop only. GitHub runs this repository's schedules hours late or not at all,
    # so nothing here depends on them. The email is handed to Brevo when a recap is posted
    # (below), days before it is due, and Brevo sends it at 6pm on Monday. The 3pm task on
    # Harold's PC starts this workflow daily as well. Every run is safe to repeat.
    - cron: "23 3,15,19,21 * * *"
  workflow_run:
    # a recap being posted is what schedules the coming Monday's email, or updates it
    workflows: ["Night recaps"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = schedule or update the coming Monday | dry = build and report, contact nobody | test = send it to the Brevo account owner only | rehearse = walk the Brevo calls with a campaign that has no recipients"
        default: dry
        type: choice
        options: [auto, dry, test, rehearse]

permissions:
  contents: write

concurrency:
  group: weekly-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Build the email and its photo
        run: python build/send_email.py --dry
      - name: Publish the photo
        run: |
          if [ -n "$(git status --porcelain img/email)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add img/email
            git commit -m "Photo for the weekly email"
            git pull --rebase --quiet origin main
            git push
          fi
      - name: Hand it to Brevo
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'auto'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: python build/send_email.py
      - name: Send a test to the account owner
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python build/send_email.py --test=owner
      - name: Rehearse the Brevo calls
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearse'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
        run: python build/send_email.py --test=rehearse
      - name: Record what was scheduled
        if: always()
        run: |
          if [ -n "$(git status --porcelain email-sent.json)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add email-sent.json
            git commit -m "Weekly email scheduled"
            git pull --rebase --quiet origin main
            git push
          fi
