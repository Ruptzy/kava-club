name: Weekly email

on:
  schedule:
    # A backstop only. GitHub runs this repository's schedules hours late or not at all,
    # so the timing is done elsewhere: Brevo sends at 6pm, and the 3pm task on Harold's PC
    # starts this workflow. These are asked for all through Monday, Bradenton time, so that
    # at least one lands. Every run is safe to repeat; see build/send_email.py.
    - cron: "23 14-23 * * 1"
    - cron: "23 0-3 * * 2"
  workflow_run:
    # a recap posted on a Monday goes straight into the email that is waiting to send
    workflows: ["Night recaps"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = the normal Monday rules | dry = build and report, contact nobody | test = send it to the Brevo account owner only | rehearse = walk the Brevo calls with a campaign that has no recipients"
        default: dry
        type: choice
        options: [auto, dry, test, rehearse]

permissions:
  contents: write

concurrency:
  group: weekly-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Build the email and its photo
        run: python build/send_email.py --dry
      - name: Publish the photo
        run: |
          if [ -n "$(git status --porcelain img/email)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add img/email
            git commit -m "Photo for the weekly email"
            git pull --rebase --quiet origin main
            git push
          fi
      - name: Hand it to Brevo
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'auto'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python build/send_email.py
      - name: Send a test to the account owner
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python build/send_email.py --test=owner
      - name: Rehearse the Brevo calls
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearse'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python build/send_email.py --test=rehearse
      - name: Record what was scheduled
        if: always()
        run: |
          if [ -n "$(git status --porcelain email-sent.json)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add email-sent.json
            git commit -m "Weekly email scheduled"
            git pull --rebase --quiet origin main
            git push
          fi
