name: Tonight on Discord

on:
  schedule:
    # GitHub runs this repository's schedules 4 to 7 hours late, every day without
    # exception (measured on the Google reviews job, which has never once run on time).
    # So this is a net rather than an appointment: an event every five minutes across a
    # wide band, and whichever one GitHub actually gets round to inside 2pm-7pm Bradenton
    # time does the posting. The ledger keeps it to one post a day. Actions minutes are
    # unmetered on a public repository, so the extra events cost nothing.
    # For a post that really lands at 2pm, an outside trigger has to call this workflow;
    # GitHub's own scheduler cannot do it.
    - cron: "*/5 14-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = print it here only, post = really send it to the channel"
        default: dry
        type: choice
        options: [dry, post]

permissions:
  contents: write

concurrency:
  group: tonight-post
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Say what is on tonight
        env:
          CLUB_SCHEDULE: ${{ secrets.SCHEDULE_FOR_DAY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "dry" ]; then
            python build/post_tonight.py --dry
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python build/post_tonight.py --force
          else
            python build/post_tonight.py
          fi
      - name: Record that it went out
        if: always()
        run: |
          if [ -n "$(git status --porcelain tonight-posted.json)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add tonight-posted.json
            git commit -m "Schedule post sent"
            git pull --rebase --quiet origin main
            git push
          fi
