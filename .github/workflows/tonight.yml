name: Tonight on Discord

on:
  schedule:
    # This schedule is only a backstop. The timing is done by a scheduled task on Harold's
    # PC, which dispatches this workflow at 3pm Bradenton time; GitHub acts on a dispatch in
    # seconds. GitHub's own scheduler executes only a handful of the runs it is asked for,
    # at times of its choosing, and drops the rest, so: asked for at off-peak minutes, and
    # any run that lands early waits for 3pm before posting (hence the long timeout). A
    # late run that finds a club night went unannounced fails on purpose, which makes
    # GitHub email the owner.
    - cron: "13,43 14-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = the normal rules (3pm, once a day) | dry = print only | post = send now"
        default: dry
        type: choice
        options: [auto, dry, post]

permissions:
  contents: write

concurrency:
  group: tonight-post
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # it may sit and wait for 3pm in Bradenton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Say what is on tonight
        env:
          CLUB_SCHEDULE: ${{ secrets.SCHEDULE_FOR_DAY }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.mode }}" = "auto" ]; then
            python build/post_tonight.py
          elif [ "${{ inputs.mode }}" = "dry" ]; then
            python build/post_tonight.py --dry
          else
            python build/post_tonight.py --force
          fi
      - name: Record that it went out
        if: always()
        run: |
          if [ -n "$(git status --porcelain tonight-posted.json)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add tonight-posted.json
            git commit -m "Schedule post sent"
            git pull --rebase --quiet origin main
            git push
          fi
