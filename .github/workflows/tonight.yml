name: Tonight on Discord

on:
  schedule:
    # Measured over a week: of the ~120 runs asked for each day, GitHub actually executes
    # two to four, at times of its own choosing. So the schedule is only a way of getting
    # a runner at all. The script does the timing: a run that lands before 3pm Bradenton
    # waits for 3pm and then posts, which is why the job needs a long timeout.
    - cron: "*/5 14-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = the normal rules (3pm, once a day) | dry = print only | post = send now"
        default: dry
        type: choice
        options: [auto, dry, post]

permissions:
  contents: write

concurrency:
  group: tonight-post
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 360        # it may sit and wait for 3pm in Bradenton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Say what is on tonight
        env:
          CLUB_SCHEDULE: ${{ secrets.SCHEDULE_FOR_DAY }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.mode }}" = "auto" ]; then
            python build/post_tonight.py
          elif [ "${{ inputs.mode }}" = "dry" ]; then
            python build/post_tonight.py --dry
          else
            python build/post_tonight.py --force
          fi
      - name: Record that it went out
        if: always()
        run: |
          if [ -n "$(git status --porcelain tonight-posted.json)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add tonight-posted.json
            git commit -m "Schedule post sent"
            git pull --rebase --quiet origin main
            git push
          fi
