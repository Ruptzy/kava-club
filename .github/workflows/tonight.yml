name: Tonight on Discord

on:
  schedule:
    # Every five minutes through the early afternoon in Bradenton, so the post lands at
    # 2pm without anyone touching it. GitHub's scheduled runs are best-effort and ours
    # have been two to three hours late when asked for a single time on the hour; asking
    # often means one of them fires within minutes of 2pm even when some are delayed.
    # 17:00-21:00 UTC covers 1pm-5pm Bradenton on daylight time and noon-4pm on standard
    # time. The script posts on the first run at or after 2pm local and writes down the
    # day, so the other runs do nothing. Free: Actions minutes are unmetered on a public
    # repository.
    - cron: "*/5 17-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = print it here only, post = really send it to the channel"
        default: dry
        type: choice
        options: [dry, post]

permissions:
  contents: write

concurrency:
  group: tonight-post
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Say what is on tonight
        env:
          CLUB_SCHEDULE: ${{ secrets.SCHEDULE_FOR_DAY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "dry" ]; then
            python build/post_tonight.py --dry
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python build/post_tonight.py --force
          else
            python build/post_tonight.py
          fi
      - name: Record that it went out
        if: always()
        run: |
          if [ -n "$(git status --porcelain tonight-posted.json)" ]; then
            git config user.name "nights-bot"
            git config user.email "nights-bot@users.noreply.github.com"
            git add tonight-posted.json
            git commit -m "Schedule post sent"
            git pull --rebase --quiet origin main
            git push
          fi
