name: Google reviews

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 9:17 UTC (5:17 AM Bradenton)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch reviews
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}   # optional: found automatically when unset
        run: python build/fetch_reviews.py
      - name: Commit if changed
        run: |
          git config user.name "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add reviews.json
          git diff --cached --quiet || git commit -m "Refresh Google reviews"
          git push
